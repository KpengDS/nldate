[project]
name = "nldate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kangxin Peng", email = "k2peng@ucsd.edu" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
nldate = "nldate:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff.lint.per-file-ignores]
"tests/test_parser.py" = ["F401"]

[tool.ruff.format]
exclude = ["tests/test_parser.py"]
